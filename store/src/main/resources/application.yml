# ==============================================================================
# store.app API — Phase 0 Step 1
#
# NOTE: application.properties was DELETED. Spring Boot loads .properties and .yml
# together, and .properties wins. Keeping both would silently override the
# Keycloak issuers and DB password below. See store-app-plan.md section 3.1.
# ==============================================================================
spring:
  application:
    name: store

  # Loads application-local.yml (git-ignored) for local credentials.
  # Remove this import when deploying — the file is not in version control.
  config:
    import: "optional:classpath:application-local.yml"

  datasource:
    # store_app ONLY. The 'storefront' database on this server holds unrelated
    # project data (7 tables, live rows) and must never be pointed at here.
    # See store-app-plan.md R13.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/store_app}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: store-hikari

  jpa:
    hibernate:
      # Flyway owns the schema, always. Never let Hibernate create it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # The rabbitmq:3.13 image refuses the built-in 'guest' user for remote
    # connections, so the container's own admin user is used instead.
    # Find it:  docker inspect rabbitmq-server --format '{{range .Config.Env}}{{println .}}{{end}}' | grep RABBITMQ_DEFAULT
    username: ${RABBITMQ_USER:monu}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        default-requeue-rejected: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

# ==============================================================================
# Application settings
# ==============================================================================
store:
  storefront:
    # Where eSewa sends the customer back to, and the base for shareable shop links.
    # Server-configured on purpose: a payment return url the browser can influence is an open
    # redirect, and an open redirect on a payment page is a phishing page.
    base-url: ${STOREFRONT_BASE_URL:http://localhost:3000}

  # Merchant-secret encryption passphrase for eSewa and bank details. Deliberately has no
  # default: without it, PaymentMethodService refuses to store secrets and says so, which is far
  # better than a well-known key in the jar that every deployment would share. Set it to a real
  # secret in application-local.yml or the environment.
  secrets:
    key: ${STORE_SECRETS_KEY:}


  # Outbox relay (R5). Set enabled=false to run without RabbitMQ: the order flow still works and
  # events accumulate unpublished, which is the designed behaviour rather than a failure.
  themes:
    # Publishes two starter templates on boot if their codes are absent. Never overwrites.
    # Off in the test profile, where tests assert on marketplace contents.
    seed: true
  outbox:
    enabled: true
    poll-interval-ms: 2000
    batch-size: 50
  keycloak:
    # VERIFIED live 2026-10-01. Both realms return a valid OpenID configuration
    # document and support PKCE S256.
    base-url: https://auth-master.yenyasoft.com
    ops-issuer: ${KEYCLOAK_OPS_ISSUER:https://auth-master.yenyasoft.com/realms/ops}
    customer-issuer: ${KEYCLOAK_CUSTOMER_ISSUER:https://auth-master.yenyasoft.com/realms/customers}
    # Client ids — Phase 0 Step 0 inspects the realms first; reuse if they exist.
    ops-client-id: ${KEYCLOAK_OPS_CLIENT_ID:store-app-console}
    customer-client-id: ${KEYCLOAK_CUSTOMER_CLIENT_ID:store-app-customer-web}
    # Local frontends that must be allowed as Keycloak web origins (R12).
    allowed-web-origins:
      - http://localhost:3000
      - http://localhost:5173

  commission:
    # 500 basis points = 5%. Stored as bp so the rate is exact and snapshot-able.
    rate-bp: ${PLATFORM_COMMISSION_RATE_BP:500}
    # Commission applies when the shop ACCEPTS the order (D2).
    apply-on: ACCEPT

  cloudinary:
    # Images are stored under shop/{shopId}/... (D19).
    folder-prefix: shop
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  # eSewa (D11, live from Phase 5). The sandbox hosts are the defaults so the integration works
  # with no configuration; production sets ESEWA_FORM_URL and ESEWA_STATUS_URL.
  #
  # The form and the status API are on DIFFERENT hosts in UAT -- the status path under
  # rc-epay answers 404 -- which is a confusing way to find out.
  esewa:
    enabled: ${ESEWA_ENABLED:true}
    merchant-id: ${ESEWA_MERCHANT_ID:EPAYTEST}
    # Only the fallback for a shop that has configured no credential of its own. A real
    # deployment keeps the secret per shop, encrypted, in shop_payment_method.
    merchant-secret: ${ESEWA_MERCHANT_SECRET:}
    form-url: ${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
    status-url: ${ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
    # Short on purpose: the customer's browser is parked on our return page while this runs.
    timeout-seconds: ${ESEWA_TIMEOUT_SECONDS:20}

  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    # A file path, not inline JSON: a multi-line PEM inside YAML needs escaping, and one wrong
    # indentation produces a key that parses to the wrong thing.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

# ==============================================================================
# Actuator
# ==============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Local dev: always show which indicator is failing. A bare
      # {"status":"DOWN"} is useless for debugging.
      show-details: always
      show-components: always

# ==============================================================================
# Logging
# ==============================================================================
logging:
  level:
    root: INFO
    com.storefront.store: DEBUG
    org.springframework.security: INFO

# ==============================================================================
# springdoc — OpenAPI 3.1, consumed by the Admin Data Explorer (D5)
# ==============================================================================
springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/swagger-ui.html
